[tools]
python = "3.12.15"
uv = "0.13.7"

[tasks.setup]
description = "安装锁定的项目依赖"
run = "uv sync --locked --python 3.12.15"

[tasks.dev]
description = "启动本地 MCP 服务"
run = "uv run --locked voxlens-mcp"

[tasks.check]
description = "检查 Python 格式和代码规范（只读）"
run = ["uv run --locked ruff format --check .", "uv run --locked ruff check ."]

[tasks.test]
description = "运行离线测试"
run = "uv run --locked pytest"

[tasks.build]
description = "生成 Python 分发包"
run = "uv build"
